name: Update library metadata

on:
  push:
    branches:
      - dev
      - dev_9.1

permissions:
  contents: read

concurrency:
  group: update-library-metadata-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-library-metadata:
    if: "${{ github.event.head_commit == null || !startsWith(github.event.head_commit.message, 'CHORE: Update library metadata') }}"
    runs-on: ubuntu-latest

    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.HELPER_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.HELPER_SYNC_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Get GitHub App user ID
        id: app-user
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Apply automatic Symcon style fixes
        uses: Burki24/Symcon_ModuleCI/style-fix@dev
        with:
          push: 'false'
          commit-user-name: ${{ steps.app-token.outputs.app-slug }}[bot]
          commit-user-email: ${{ steps.app-user.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com

      - name: Verify Symcon style after automatic fixes
        uses: Burki24/Symcon_ModuleCI/style@v1.0.0

      - name: Run shared module tests
        uses: Burki24/Symcon_ModuleCI/php-tests@v1.0.0
        with:
          php-version: '8.5'
          php-extensions: curl, dom

      - name: Check current library metadata
        id: metadata
        shell: bash
        run: |
          commit_count="$(git rev-list --count HEAD)"
          library_build="$(php -r '$library = json_decode(file_get_contents("library.json"), true); echo (int) ($library["build"] ?? -1);')"

          echo "commit_count=${commit_count}" >> "${GITHUB_OUTPUT}"
          echo "library_build=${library_build}" >> "${GITHUB_OUTPUT}"

          if [ "${library_build}" = "${commit_count}" ]; then
            echo "current=true" >> "${GITHUB_OUTPUT}"
          else
            echo "current=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Update library metadata
        if: steps.metadata.outputs.current != 'true'
        run: php .github/scripts/update-library-metadata.php --next-build

      - name: Commit and push metadata
        if: steps.metadata.outputs.current != 'true'
        shell: bash
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          APP_USER_ID: ${{ steps.app-user.outputs.user-id }}
        run: |
          set -euo pipefail

          if git diff --quiet -- library.json; then
            echo "library.json is already current."
            exit 0
          fi

          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"

          version=$(php -r '$library = json_decode(file_get_contents("library.json"), true); echo (string) $library["version"];')
          build=$(php -r '$library = json_decode(file_get_contents("library.json"), true); echo (int) $library["build"];')
          source_sha="$(git rev-parse HEAD)"
          short_sha=${source_sha:0:7}

          git add library.json
          git commit -m "CHORE: Update library metadata to v${version} build ${build} (${short_sha})"
          git push origin "HEAD:${GITHUB_REF_NAME}"
