name: Check Style

on:
  push:
    branches:
      - dev
      - dev_9.1
      - main
  pull_request:
    branches:
      - dev
      - dev_9.1
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  style:
    name: style
    if: >-
      ${{
        github.event_name != 'push'
        || github.ref_name == 'main'
        || startsWith(github.event.head_commit.message, 'CHORE: Update library metadata')
      }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run shared style check
        uses: Burki24/Symcon_ModuleCI/style@v1.0.0
