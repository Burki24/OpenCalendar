<!DOCTYPE html>
<html lang="{{HTML_LANGUAGE}}" class="{{HTML_CLASSES}}" style="font-size: {{ROOT_FONT_SIZE}};">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="{{VIEWPORT_CONTENT}}">
    <title>{{DOCUMENT_TITLE}}</title>
    <style>{{VISUALIZATION_THEME}}
{{MODULE_STYLE}}
{{IPSVIEW_STYLE}}</style>
</head>
<body>
<div id="calendar-app">
    <div class="toolbar">
        <div class="toolbar-group">
            <button class="icon-button" id="previous-button" title="Previous" aria-label="Previous">‹</button>
            <button class="icon-button" id="today-button" title="Today" aria-label="Today">●</button>
            <button class="icon-button" id="next-button" title="Next" aria-label="Next">›</button>
        </div>
        <div class="toolbar-title" id="period-title"></div>
        <div class="toolbar-spacer"></div>
        <button class="view-selector-button" id="view-selector-button" type="button" aria-haspopup="dialog"
            aria-controls="view-selector-dialog" aria-expanded="false">
            <svg class="view-selector-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <rect x="4" y="4" width="6" height="6" rx="1"></rect>
                <rect x="14" y="4" width="6" height="6" rx="1"></rect>
                <rect x="4" y="14" width="6" height="6" rx="1"></rect>
                <rect x="14" y="14" width="6" height="6" rx="1"></rect>
            </svg>
            <span class="view-selector-label" id="view-selector-label">Agenda</span>
            <span class="view-selector-chevron" aria-hidden="true">⌄</span>
        </button>
        <button class="floating-add" id="add-button" title="Create event" aria-label="Create event">
            <span class="floating-add-symbol" aria-hidden="true">＋</span>
            <span class="floating-add-label" id="add-button-label">New event</span>
        </button>
        <div class="toolbar-group toolbar-actions">
            <button class="icon-button" id="calendar-filter-button" title="Filter calendars" aria-label="Filter calendars">
                <svg class="calendar-filter-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M3 5h18l-7 8v5.5l-4 2V13L3 5z"></path>
                </svg>
            </button>
            <button class="icon-button" id="refresh-button" title="Refresh" aria-label="Refresh">↻</button>
        </div>
    </div>
    <main class="content" id="calendar-content"></main>
    <div class="toast" id="toast" role="status"></div>
</div>

<dialog id="view-selector-dialog" class="oc-dialog oc-dialog-small view-selector-dialog">
    <div class="dialog-header">
        <span class="dialog-accent" style="--dialog-accent-color:var(--cal-accent)"></span>
        <h2 id="view-selector-dialog-title">View</h2>
        <button type="button" class="icon-button dialog-close-button" id="view-selector-close" aria-label="Close">×</button>
    </div>
    <div class="dialog-body view-selector-body">
        <div class="view-selector-options" id="view-selector-options" role="radiogroup" aria-labelledby="view-selector-dialog-title">
            <button type="button" class="view-selector-option" data-view="agenda" role="radio" aria-checked="false">Agenda</button>
            <button type="button" class="view-selector-option" data-view="list" role="radio" aria-checked="false">List</button>
            <button type="button" class="view-selector-option" data-view="threeDays" role="radio" aria-checked="false">3 Days</button>
            <button type="button" class="view-selector-option" data-view="week" role="radio" aria-checked="false">Week</button>
            <button type="button" class="view-selector-option" data-view="month" role="radio" aria-checked="false">Month</button>
        </div>
    </div>
    <div class="dialog-actions">
        <div class="dialog-actions-end">
            <button type="button" class="secondary-button" id="view-selector-close-button">Close</button>
        </div>
    </div>
</dialog>

<dialog id="event-dialog" class="oc-dialog oc-dialog-large">
    <form id="event-form" class="dialog-layout">
        <div class="dialog-header">
            <span id="dialog-color" class="dialog-accent" style="--dialog-accent-color:var(--cal-accent)"></span>
            <h2 id="dialog-title">Event</h2>
            <button type="button" class="icon-button dialog-close-button" id="dialog-close" aria-label="Close">×</button>
        </div>
        <div class="dialog-body">
            <div class="form-row">
                <label for="event-calendar-trigger" id="event-calendar-label">Calendar</label>
                <div class="calendar-picker" id="event-calendar-picker">
                    <input type="hidden" id="event-calendar">
                    <button type="button" class="calendar-picker-trigger" id="event-calendar-trigger"
                        aria-haspopup="listbox" aria-expanded="false" aria-controls="event-calendar-options">
                        <span id="event-calendar-value"></span>
                        <span class="calendar-picker-chevron" aria-hidden="true">⌄</span>
                    </button>
                    <div class="calendar-picker-options hidden" id="event-calendar-options" role="listbox"
                        aria-labelledby="event-calendar-label"></div>
                </div>
            </div>
            <div class="form-row">
                <label for="event-summary">Title</label>
                <input id="event-summary" maxlength="250" required>
            </div>
            <label class="checkbox-row"><input type="checkbox" id="event-all-day"> <span id="all-day-label">All day</span></label>
            <div class="form-row two">
                <div class="form-row">
                    <label for="event-start">Start</label>
                    <input id="event-start" type="datetime-local" required>
                </div>
                <div class="form-row">
                    <label for="event-end">End</label>
                    <input id="event-end" type="datetime-local" required>
                </div>
            </div>
            <div class="form-row">
                <label for="event-location">Location</label>
                <input id="event-location" maxlength="500">
            </div>
            <div class="form-row">
                <label for="event-description">Description</label>
                <textarea id="event-description" maxlength="5000"></textarea>
            </div>
            <div class="dialog-note hidden" id="dialog-note"></div>
        </div>
        <div class="dialog-actions">
            <div class="dialog-actions-start">
                <button type="button" class="danger-button hidden" id="delete-button">Delete</button>
            </div>
            <div class="dialog-actions-end">
                <button type="button" class="secondary-button" id="cancel-button">Cancel</button>
                <button type="submit" class="primary-button" id="save-button">Save</button>
            </div>
        </div>
    </form>
</dialog>

<dialog id="event-details-dialog" class="oc-dialog oc-dialog-medium event-details-dialog">
    <div class="dialog-header">
        <span id="details-color" class="dialog-accent" style="--dialog-accent-color:var(--cal-accent)"></span>
        <h2 id="details-dialog-title">Event details</h2>
        <button type="button" class="icon-button dialog-close-button" id="details-close" aria-label="Close">×</button>
    </div>
    <div class="dialog-body event-details-body">
        <div class="event-details-summary" id="details-summary"></div>
        <dl class="event-details-list">
            <div class="event-details-row">
                <dt id="details-calendar-label">Calendar</dt>
                <dd id="details-calendar"></dd>
            </div>
            <div class="event-details-row">
                <dt id="details-start-label">Start</dt>
                <dd id="details-start"></dd>
            </div>
            <div class="event-details-row">
                <dt id="details-end-label">End</dt>
                <dd id="details-end"></dd>
            </div>
            <div class="event-details-row hidden" id="details-location-row">
                <dt id="details-location-label">Location</dt>
                <dd id="details-location"></dd>
            </div>
            <div class="event-details-row hidden" id="details-description-row">
                <dt id="details-description-label">Description</dt>
                <dd id="details-description"></dd>
            </div>
        </dl>
        <div class="dialog-note hidden" id="details-note"></div>
    </div>
    <div class="dialog-actions">
        <div class="dialog-actions-start">
            <button type="button" class="danger-button hidden" id="details-delete-button">Delete</button>
        </div>
        <div class="dialog-actions-end">
            <button type="button" class="secondary-button" id="details-close-button">Close</button>
            <button type="button" class="primary-button hidden" id="details-edit-button">Edit</button>
        </div>
    </div>
</dialog>

<dialog id="delete-confirm-dialog" class="oc-dialog oc-dialog-small delete-confirm-dialog">
    <div class="dialog-header">
        <span class="dialog-accent" style="--dialog-accent-color:var(--cal-danger)"></span>
        <h2 id="delete-confirm-dialog-title">Delete event</h2>
        <button type="button" class="icon-button dialog-close-button" id="delete-confirm-close" aria-label="Close">×</button>
    </div>
    <div class="dialog-body delete-confirm-body">
        <div class="delete-confirm-summary" id="delete-confirm-summary"></div>
        <div class="delete-confirm-period" id="delete-confirm-period"></div>
        <p class="delete-confirm-question" id="delete-confirm-question">Do you really want to delete this event?</p>
    </div>
    <div class="dialog-actions">
        <div class="dialog-actions-end">
            <button type="button" class="secondary-button" id="delete-confirm-cancel">Cancel</button>
            <button type="button" class="danger-button" id="delete-confirm-button">Delete</button>
        </div>
    </div>
</dialog>

<dialog id="day-events-dialog" class="oc-dialog oc-dialog-large day-events-dialog">
    <div class="dialog-header">
        <span class="dialog-accent" style="--dialog-accent-color:var(--cal-accent)"></span>
        <h2 id="day-events-dialog-title">Day events</h2>
        <button type="button" class="icon-button dialog-close-button" id="day-events-close" aria-label="Close">×</button>
    </div>
    <div class="dialog-body day-events-body">
        <div class="day-events-count" id="day-events-count"></div>
        <div class="day-events-list" id="day-events-list"></div>
    </div>
    <div class="dialog-actions">
        <div class="dialog-actions-start">
            <button type="button" class="secondary-button hidden" id="day-events-create-button">Create event on this day</button>
        </div>
        <div class="dialog-actions-end">
            <button type="button" class="secondary-button" id="day-events-close-button">Close</button>
        </div>
    </div>
</dialog>
<dialog id="calendar-filter-dialog" class="oc-dialog oc-dialog-medium calendar-filter-dialog">
    <div class="dialog-header">
        <span class="dialog-accent" style="--dialog-accent-color:var(--cal-accent)"></span>
        <h2 id="calendar-filter-dialog-title">Filter calendars</h2>
        <button type="button" class="icon-button dialog-close-button" id="calendar-filter-close" aria-label="Close">×</button>
    </div>
    <div class="dialog-body calendar-filter-body">
        <div class="calendar-filter-selection-actions">
            <button type="button" class="secondary-button" id="calendar-filter-all">Select all</button>
            <button type="button" class="secondary-button" id="calendar-filter-none">Select none</button>
        </div>
        <div class="calendar-filter-options" id="calendar-filter-options"></div>
        <div class="dialog-note" id="calendar-filter-note">This filter only changes the current view on this browser or monitor.</div>
    </div>
    <div class="dialog-actions">
        <div class="dialog-actions-end">
            <button type="button" class="secondary-button" id="calendar-filter-cancel">Cancel</button>
            <button type="button" class="primary-button" id="calendar-filter-apply">Apply</button>
        </div>
    </div>
</dialog>

<script>
window.SYMC_VISUALIZATION = {{BOOTSTRAP_JSON}};
{{MODULE_SCRIPT}}
</script>
</body>
</html>
